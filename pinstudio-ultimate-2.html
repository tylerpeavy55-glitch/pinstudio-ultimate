<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PinStudio Ultimate — Pinterest Pin Designer</title>
<!-- Google Fonts (fallback fonts are used automatically when offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Archivo+Black&family=Barlow+Condensed:wght@400;600;700&family=Montserrat:wght@400;600;800&family=Poppins:wght@400;600;800&family=Inter:wght@400;600;800&family=DM+Sans:wght@400;600;800&family=Lato:wght@400;700;900&family=Nunito:wght@400;700;900&family=Roboto:wght@400;700;900&family=Roboto+Slab:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Merriweather:wght@400;700;900&family=League+Spartan:wght@400;700;900&family=Raleway:wght@400;700;900&family=Open+Sans:wght@400;700;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ===== PinStudio Ultimate — styles ===== */
:root{--bd:#e5e7eb;--tx:#1f2937;--mu:#6b7280;--ac:#1f7a4d;--ac2:#e8f5ee;--bg:#f3f4f6;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;font-family:Inter,system-ui,Arial,sans-serif;font-size:14px;color:var(--tx);background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;border-bottom:1px solid var(--bd);z-index:5;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:16px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#1f7a4d,#e8590c);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.logo span{color:var(--ac);font-weight:700}
#modes{display:flex;background:#f3f4f6;border-radius:999px;padding:3px;gap:2px;margin-left:8px}
#modes button{border:0;background:transparent;padding:6px 12px;border-radius:999px;white-space:nowrap;font-weight:600;color:var(--mu)}
#modes button.on{background:#fff;color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp{flex:1}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 11px;font-weight:600;white-space:nowrap}
.btn:hover{background:#f9fafb}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#18633e}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.dng{color:#b91c1c}
#quick{max-width:190px;border:1px solid var(--bd);border-radius:8px;padding:7px;background:#fff}
main{flex:1;min-height:0;display:flex}
#side{width:370px;flex:none;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#tabs{flex:none;display:flex;gap:4px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--bd)}
#tabs button{border:0;background:#f3f4f6;border-radius:8px;padding:7px 12px;font-weight:600;color:var(--mu);white-space:nowrap}
#tabs button.on{background:var(--ac2);color:var(--ac)}
#panel{flex:1;overflow-y:auto;padding:10px 12px 40px}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;background:#e9ebee;background-image:radial-gradient(#d4d7dc 1px,transparent 1px);background-size:18px 18px}
#wrap{position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25);background:#fff;touch-action:none}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ov{cursor:default}
#info{flex:none;margin-top:10px;font-size:12px;color:var(--mu);text-align:center}
#layers{width:270px;flex:none;background:#fff;border-left:1px solid var(--bd);overflow-y:auto;padding:10px}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
details{border:1px solid var(--bd);border-radius:var(--r);margin:0 0 10px;background:#fff}
summary{cursor:pointer;padding:9px 12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mu);font-weight:400;font-size:18px}
details[open]>summary::after{content:"–"}
details>.in{padding:2px 12px 12px;display:grid;gap:9px}
.f{display:grid;gap:4px}
.f.row{grid-auto-flow:column;grid-template-columns:1fr auto;align-items:center}
.fl{font-size:12px;color:var(--mu);font-weight:600;display:flex;justify-content:space-between}
.fl output{color:var(--tx);font-weight:700}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.f.row input[type=color]{width:56px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;background:#fff}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:6px 4px;border-right:1px solid var(--bd)}
.seg button:last-child{border:0}
.seg button.on{background:var(--ac2);color:var(--ac);font-weight:700}
.drop{border:2px dashed #cbd5e1;border-radius:10px;padding:14px;text-align:center;color:var(--mu);background:#fafafa;cursor:pointer}
.drop:hover{border-color:var(--ac);color:var(--ac)}
.note{font-size:12px;color:var(--mu);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:5px 10px;background:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ac)}
.chip b{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.lrow{display:flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:8px;padding:5px 6px;margin-bottom:6px;background:#fff}
.lrow.on{border-color:var(--ac);background:var(--ac2)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13px}
.lrow .ib{border:0;background:transparent;padding:3px 5px;border-radius:6px;font-size:13px;color:var(--mu)}
.lrow .ib:hover{background:#e5e7eb;color:var(--tx)}
.lrow .ib.off{opacity:.35}
.lg{font-size:11px;text-transform:uppercase;color:var(--mu);margin:10px 0 5px;font-weight:700}
.prog{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(92vw,420px)}
#toast div{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:13px}
#toast div.err{background:#b91c1c}#toast div.ok{background:#15803d}
.stat{font-size:12px;padding:8px 10px;border-radius:8px;background:#f3f4f6}
@media(max-width:900px){
  main{flex-direction:column}
  #layers{display:none}
  #stage{flex:1 1 auto;min-height:36vh;padding:8px}
  #side{width:100%;height:46vh;flex:none;border-right:0;border-top:1px solid var(--bd)}
  #quick{display:none}
  .logo b{display:none}
  #top{gap:6px}
}
@media(min-width:901px){#tabs button[data-t=layers]{display:none}}
</style>
</head>
<body>
<header id="top">
  <div class="logo"><i>P</i><b>PinStudio</b><span>Ultimate</span></div>
  <nav id="modes"></nav>
  <select id="quick" title="Quick-start template: applies text, layout and colours"></select>
  <div class="sp"></div>
  <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
  <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  <button class="btn" id="bReset" title="Reset the current design">Reset</button>
  <button class="btn" id="bSave" title="Save project in this browser">Save</button>
  <button class="btn pri" id="bExport" title="Download PNG with current Download Quality settings">Export PNG</button>
</header>
<main>
  <aside id="side"><nav id="tabs"></nav><div id="panel"></div></aside>
  <section id="stage">
    <div id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
    <div id="info"></div>
  </section>
  <aside id="layers"><h3>Layers</h3><div id="layerList"></div></aside>
</main>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<script>
'use strict';
/* =====================================================================
   PinStudio Ultimate — core: utilities, fonts, state, illustrations, text engine
   ===================================================================== */

/* ---------- 1. Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function merge(a, b) { // deep merge b into a copy of a
  const o = clone(a);
  for (const k in (b || {})) o[k] = (isObj(o[k]) && isObj(b[k])) ? merge(o[k], b[k]) : clone(b[k]);
  return o;
}
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const hexA = (hex, a) => {
  hex = (hex || '#000000').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
  const n = parseInt(hex.slice(0, 6), 16) || 0;
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
function rr(c, x, y, w, h, r) { // rounded rect path
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function rng(seed) { // seeded random
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function toast(msg, type = '') {
  const d = el('div', { class: type }, msg); $('#toast').append(d);
  setTimeout(() => d.remove(), type === 'err' ? 7000 : 3200);
}

/* ---------- 2. Fonts ---------- */
const FONTS = [
  ['Anton', 'Impact, "Arial Narrow", sans-serif'], ['Bebas Neue', 'Impact, "Arial Narrow", sans-serif'],
  ['Oswald', '"Arial Narrow", sans-serif'], ['Archivo Black', 'Arial Black, sans-serif'],
  ['Barlow Condensed', '"Arial Narrow", sans-serif'], ['Montserrat', 'Arial, sans-serif'],
  ['Poppins', 'Arial, sans-serif'], ['Inter', 'Arial, sans-serif'], ['DM Sans', 'Arial, sans-serif'],
  ['Lato', 'Arial, sans-serif'], ['Nunito', 'Arial, sans-serif'], ['Roboto', 'Arial, sans-serif'],
  ['Roboto Slab', 'Georgia, serif'], ['Playfair Display', 'Georgia, serif'], ['DM Serif Display', 'Georgia, serif'],
  ['Merriweather', 'Georgia, serif'], ['League Spartan', 'Arial, sans-serif'], ['Raleway', 'Arial, sans-serif'],
  ['Open Sans', 'Arial, sans-serif'], ['Lora', 'Georgia, serif']
];
const fontCss = n => { const f = FONTS.find(x => x[0] === n); return `"${n}", ${f ? f[1] : 'Arial, sans-serif'}`; };
const fontPending = new Set();
function loadFont(name, weight = 400, style = 'normal') {
  if (!document.fonts) return Promise.resolve();
  return document.fonts.load(`${style === 'italic' ? 'italic ' : ''}${weight} 40px "${name}"`, 'Aa1').catch(() => { });
}
function allUsedFonts() {
  const set = new Map();
  ['photo', 'produce', 'badge'].forEach(m => (S[m].layers || []).forEach(l => set.set(l.font + l.weight + l.style, [l.font, l.weight, l.style])));
  set.set('b1', [S.brand.head, 700, 'normal']); set.set('b2', [S.brand.body, 600, 'normal']);
  return [...set.values()];
}
async function ensureFonts() {
  await Promise.all(allUsedFonts().map(f => loadFont(...f)));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
}

/* ---------- 3. Image store (images live outside undo history) ---------- */
const IMGS = {};  // id -> dataURL
const ELS = {};   // id -> HTMLImageElement
function getImg(id) {
  if (!id || !IMGS[id]) return null;
  let e = ELS[id];
  if (!e) {
    e = ELS[id] = new Image(); e.src = IMGS[id];
    e.onload = () => { e._ok = true; if (typeof renderPreview === 'function') renderPreview(); };
  }
  return (e.complete && e.naturalWidth) ? e : null;
}
function usedImageIds() {
  const ids = new Set();
  S.photo.images.forEach(i => i.id && ids.add(i.id)); S.badge.imgs.forEach(i => i.id && ids.add(i.id));
  if (S.photo.bg.img) ids.add(S.photo.bg.img); if (S.brand.logo) ids.add(S.brand.logo);
  return [...ids];
}
async function ensureImages() {
  await Promise.all(usedImageIds().map(id => new Promise(res => {
    if (!IMGS[id]) return res();
    let e = ELS[id]; if (!e) { getImg(id); e = ELS[id]; }
    if (e.complete && e.naturalWidth) return res();
    e.addEventListener('load', res, { once: true }); e.addEventListener('error', res, { once: true });
  })));
}

/* ---------- 4. State defaults ---------- */
const defImg = () => ({ id: null, zoom: 1, x: 0, y: 0, rot: 0, bright: 100, contrast: 100, sat: 100, blur: 0, opacity: 100, dim: 0, filter: 'none', radius: 0, border: 0, borderColor: '#ffffff', shadow: 0, hidden: false, locked: false });
const TEXT_BASE = {
  id: '', name: 'Text', role: 'extra', text: 'New text', anchor: 'canvas', x: 50, y: 50, maxW: 80,
  font: 'Montserrat', size: 60, weight: 700, style: 'normal', ls: 0, lh: 1.15, align: 'center', color: '#ffffff', opacity: 100,
  case: 'none', underline: false, rot: 0, autoFit: false, fitH: 30, wrap: true,
  shadow: { on: false, color: '#000000', blur: 12, dist: 6, angle: 60, opacity: 60 },
  outline: { on: false, color: '#000000', w: 4 }, outline2: { on: false, color: '#ffffff', w: 4 },
  grad: { on: false, c1: '#ffd54a', c2: '#ff5a36', angle: 90 },
  bg: { on: false, color: '#000000', opacity: 70, padX: 24, padY: 12, radius: 16 },
  glow: { on: false, color: '#ffffff', blur: 20 },
  ul: { on: false, color: '#ffd54a', w: 6, off: 6 },
  kw: { text: '', color: '#ffd54a', tcolor: '#222222', radius: 8 },
  hidden: false, locked: false
};
const mkText = o => { const t = merge(TEXT_BASE, o || {}); if (!t.id) t.id = uid(); return t; };
const SHD = { on: true, blur: 16, dist: 6, angle: 60, opacity: 55 };

function photoLayers() {
  return [
    mkText({ name: 'Headline', role: 'title', text: 'HEALTHY BABY FOOD IDEAS', font: 'Anton', weight: 400, size: 130, lh: 1.05, maxW: 84, x: 50, y: 44, shadow: SHD }),
    mkText({ name: 'Subheadline', role: 'sub', text: 'Quick, easy & nutritious first foods', font: 'Montserrat', weight: 600, size: 44, y: 60, maxW: 80, shadow: SHD }),
    mkText({ name: 'Number', role: 'num', text: '21', font: 'Anton', weight: 400, size: 280, color: '#e8590c', hidden: true, y: 14, maxW: 60 }),
    mkText({ name: 'List', role: 'list', text: '• Sweet potato\n• Avocado\n• Banana', font: 'Nunito', weight: 700, size: 40, align: 'left', color: '#2b2b2b', hidden: true, y: 80, maxW: 70 }),
    mkText({ name: 'Footer', role: 'footer', text: 'nourishedfamilyliving.blogspot.com', font: 'Montserrat', weight: 600, size: 28, y: 94, maxW: 90, shadow: SHD })
  ];
}
function produceLayers() {
  const A = 'panel', G = '#1f5d3a';
  return [
    mkText({ name: 'Main number', role: 'num', anchor: A, text: '21', font: 'Anton', weight: 400, size: 340, color: '#e8590c', x: 50, y: 19, maxW: 80, lh: 1 }),
    mkText({ name: 'Main headline', role: 'title', anchor: A, text: 'FRUITS & VEGETABLES', font: 'Anton', weight: 400, size: 118, color: G, x: 50, y: 41, maxW: 88, lh: 1.02 }),
    mkText({ name: 'Secondary headline', role: 'sub', anchor: A, text: 'TO TRY WITH YOUR BABY', font: 'Oswald', weight: 600, size: 50, color: '#e8590c', x: 50, y: 62, maxW: 88, ls: 3 }),
    mkText({ name: 'Supporting text', role: 'support', anchor: A, text: 'Simple, nutritious first foods that are easy to prepare and loved by little ones.', font: 'Lato', weight: 400, size: 34, color: '#3f3f3f', x: 50, y: 76, maxW: 78, lh: 1.3 }),
    mkText({ name: 'Footer website', role: 'footer', anchor: A, text: 'nourishedfamilyliving.blogspot.com', font: 'Montserrat', weight: 700, size: 28, color: G, x: 50, y: 92, maxW: 90 }),
    mkText({ name: 'Extra text', role: 'extra', anchor: A, text: 'SAVE THIS PIN!', font: 'Oswald', weight: 600, size: 34, color: '#ffffff', x: 50, y: 84, maxW: 60, hidden: true, ls: 3, bg: { on: true, color: '#1f5d3a', opacity: 100, padX: 22, padY: 8, radius: 30 } })
  ];
}
function badgeLayers() {
  const A = 'badge', N = '#0e2a47';
  return [
    mkText({ name: 'Number badge', role: 'num', anchor: A, text: '21', font: 'Anton', weight: 400, size: 66, color: N, x: 50, y: 2, maxW: 20, wrap: false }),
    mkText({ name: 'Main headline', role: 'title', anchor: A, text: 'BABY FOOD IDEAS', font: 'Anton', weight: 400, size: 104, color: '#ffffff', x: 50, y: 31, maxW: 80, lh: 1.02, autoFit: true, fitH: 13 }),
    mkText({ name: 'Secondary headline', role: 'sub', anchor: A, text: 'FOR YOUR', font: 'Montserrat', weight: 800, size: 44, color: '#ffffff', x: 50, y: 52, maxW: 60, ls: 6, wrap: false }),
    mkText({ name: 'Highlighted headline', role: 'hl', anchor: A, text: '7-MONTH-OLD', font: 'Anton', weight: 400, size: 76, color: N, x: 50, y: 66, maxW: 78, wrap: false }),
    mkText({ name: 'Bottom subtitle', role: 'support', anchor: A, text: 'QUICK, HEALTHY & EASY IDEAS!', font: 'Montserrat', weight: 700, size: 30, color: '#ffffff', x: 50, y: 83, maxW: 74, ls: 1, lh: 1.2 })
  ];
}

function defaultBrand() {
  return { name: 'Nourished Family Living', website: 'nourishedfamilyliving.blogspot.com', logo: null, c1: '#1f5d3a', c2: '#e8590c', c3: '#f4c542', head: 'Anton', body: 'Montserrat', footer: 'pill', pos: 'bc', wmOpacity: 90, wm: false };
}
function defaultPhoto() {
  return {
    layout: 'overlay', gap: 12, sel: 0, images: [defImg(), defImg(), defImg(), defImg()], layers: photoLayers(),
    bg: { type: 'gradient', c1: '#fdf6ec', c2: '#f3d9b8', angle: 160, pattern: 'dots', pc: '#c9a77a', pa: 35, img: null, zoom: 1 },
    ov: { on: false, color: '#000000', alpha: 25 },
    gov: { on: true, color: '#000000', alpha: 65, dir: 'bottom', size: 70 }
  };
}
function defaultProduce() {
  return {
    bg: '#1f5d3a', layers: produceLayers(),
    panel: { w: 76, h: 74, x: 0, y: 0, color: '#fbf6e9', radius: 30, border: true, bcolor: '#e6d9b4', bw: 6, shadow: true, sblur: 30 },
    ill: { set: 'mixed', size: 150, density: 18, rot: 0, spacing: 35, place: 'edge', visible: true, opacity: 100, seed: 7, ox: 0, oy: 0 },
    div: { on: true, color: '#1f5d3a', style: 'dot', w: 5, y1: 54, y2: 85 }
  };
}
function defaultBadge() {
  return {
    sel: 0, imgs: [defImg(), defImg(), defImg(), defImg()], layers: badgeLayers(),
    frame: { bg: '#fff7ea', margin: 3, ocolor: '#ffffff', ow: 10, icolor: '#1fc8c0', iw: 4, gapb: 10, radius: 40, opacity: 100 },
    grid: { vx: 50, hy: 50, th: 10, color: '#ffffff', gap: 6 },
    badge: { on: true, w: 78, h: 42, x: 50, y: 50, bg: '#0e2a47', bc: '#ffffff', bw: 14, iw: 4, ic: '#f4c542', inset: 12, dash: false, round: 100, shadow: true, opacity: 100, stars: true, starColor: '#f4c542' },
    numb: { r: 62, bg: '#f4c542', ring: '#ffffff', rw: 8 },
    banner: { bg: '#f4c542', oc: '#ffffff', ow: 5, radius: 40, w: 84, h: 15 },
    deco: { stars: true, leaves: true, branches: true, dots: true, circles: true, seps: true, color: '#f4c542', leaf: '#6aa84f' }
  };
}
function defaultState() {
  return {
    v: 1, mode: 'photo',
    canvas: { w: 1080, h: 1920, preset: 'Full HD Portrait', safe: 5, grid: false, showSafe: false, guides: false, snap: true },
    exp: { preset: 'fhd', w: 1080, h: 1920, scale: 1, quality: 'high', match: true, transparent: false },
    photo: defaultPhoto(), produce: defaultProduce(), badge: defaultBadge(), brand: defaultBrand()

}

let RAF = 0, drag = null, GUIDE = { x: false, y: false };
function renderPreview() { if (RAF) return; RAF = requestAnimationFrame(() => { RAF = 0; paintPreview(); }); }
function paintPreview() {
  const cv = $('#cv'), ov = $('#ov'), wrap = $('#wrap'), st = $('#stage'), { w: cw, h: ch } = S.canvas;
  const aw = st.clientWidth - 24, ah = st.clientHeight - 48, sc = Math.min(aw / cw, ah / ch);
  const cssW = Math.max(60, Math.floor(cw * sc)), cssH = Math.max(60, Math.floor(ch * sc));
  wrap.style.width = cssW + 'px'; wrap.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2), pw = Math.round(cssW * dpr), ph = Math.round(cssH * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = ov.width = pw; cv.height = ov.height = ph; }
  render(cv.getContext('2d'), pw, ph, { ui: true, q: 'medium' });
  drawOverlay(ov.getContext('2d'), pw, ph);
  $('#info').textContent = `${cw} × ${ch} px canvas · drag text to move · drag photos to reposition`;
  updateExpStat();
}
function drawOverlay(c, W, H) {
  c.clearRect(0, 0, W, H); const u = W / 1000, cv = S.canvas;
  c.lineWidth = Math.max(1, u);
  if (cv.grid) { c.strokeStyle = 'rgba(0,0,0,.2)'; for (let i = 1; i < 10; i++) { c.beginPath(); c.moveTo(W * i / 10, 0); c.lineTo(W * i / 10, H); c.moveTo(0, H * i / 10); c.lineTo(W, H * i / 10); c.stroke(); } }
  if (cv.showSafe) { const m = W * cv.safe / 100; c.setLineDash([8 * u, 6 * u]); c.strokeStyle = '#e11d48'; c.strokeRect(m, m, W - 2 * m, H - 2 * m); c.setLineDash([]); }
  if (cv.guides || GUIDE.x || GUIDE.y) {
    c.strokeStyle = 'rgba(14,165,233,.7)'; c.setLineDash([6 * u, 6 * u]);
    if (cv.guides) { c.beginPath(); c.moveTo(W / 2, 0); c.lineTo(W / 2, H); c.moveTo(0, H / 2); c.lineTo(W, H / 2); c.stroke(); }
    c.setLineDash([]); c.strokeStyle = '#d946ef'; c.lineWidth = 2 * u;
    if (GUIDE.x && drag && drag.m) { const b = drag.m.box; c.beginPath(); c.moveTo(b.x + b.w / 2, 0); c.lineTo(b.x + b.w / 2, H); c.stroke(); }
    if (GUIDE.y && drag && drag.m) { const b = drag.m.box; c.beginPath(); c.moveTo(0, b.y + b.h / 2); c.lineTo(W, b.y + b.h / 2); c.stroke(); }
  }
  c.lineWidth = 2 * u; c.strokeStyle = '#2563eb';
  if (SEL.k === 'text') { const h = HIT.find(x => x.id === SEL.id); if (h) { c.setLineDash([8 * u, 5 * u]); c.strokeRect(h.x0, h.y0, h.x1 - h.x0, h.y1 - h.y0); c.setLineDash([]); c.fillStyle = '#fff'; [[h.x0, h.y0], [h.x1, h.y0], [h.x0, h.y1], [h.x1, h.y1]].forEach(([x, y]) => { c.fillRect(x - 5 * u, y - 5 * u, 10 * u, 10 * u); c.strokeRect(x - 5 * u, y - 5 * u, 10 * u, 10 * u); }); } }
  else if (SEL.k === 'img') { const s = GEO.slots.find(x => x.idx === SEL.idx); if (s) c.strokeRect(s.r[0] + u, s.r[1] + u, s.r[2] - 2 * u, s.r[3] - 2 * u); }
}
const ovc = $('#ov');
const ptr = e => { const r = ovc.getBoundingClientRect(); return [(e.clientX - r.left) * ovc.width / r.width, (e.clientY - r.top) * ovc.height / r.height]; };
const hitText = (x, y) => [...HIT].reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
const hitSlot = (x, y) => [...GEO.slots].reverse().find(s => x >= s.r[0] && x <= s.r[0] + s.r[2] && y >= s.r[1] && y <= s.r[1] + s.r[3]);
ovc.addEventListener('pointerdown', e => {
  const [x, y] = ptr(e), ht = hitText(x, y); drag = null;
  if (ht) { const L = curLayers().find(l => l.id === ht.id); SEL = { k: 'text', id: L.id }; if (!L.locked) drag = { k: 'text', L, x, y, lx: L.x, ly: L.y, m: METRICS[L.id], moved: false }; }
  else { const s = hitSlot(x, y); if (s) { SEL = { k: 'img', idx: s.idx }; holder().sel = s.idx; drag = { k: 'img', s, x, y, ix: s.im.x, iy: s.im.y, moved: false, canMove: !!s.im.id && !s.im.locked }; } else SEL = { k: 'text', id: null }; }
  ovc.setPointerCapture(e.pointerId); buildLayers(); renderPreview();
});
ovc.addEventListener('pointermove', e => {
  const [x, y] = ptr(e);
  if (!drag) { ovc.style.cursor = hitText(x, y) ? 'move' : (hitSlot(x, y) ? 'grab' : 'default'); return; }
  const dx = x - drag.x, dy = y - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; if (!drag.moved) return;
  if (drag.k === 'text') {
    const b = drag.m.box; let nx = drag.lx + dx / b.w * 100, ny = drag.ly + dy / b.h * 100; GUIDE = { x: false, y: false };
    if (S.canvas.snap) { if (Math.abs(nx - 50) < 1.5) { nx = 50; GUIDE.x = true; } if (Math.abs(ny - 50) < 1.5) { ny = 50; GUIDE.y = true; } }
    drag.L.x = +nx.toFixed(2); drag.L.y = +ny.toFixed(2);
  } else if (drag.canMove) { drag.s.im.x = clamp(drag.ix + dx / drag.s.r[2] * 100, -100, 100); drag.s.im.y = clamp(drag.iy + dy / drag.s.r[3] * 100, -100, 100); }
  renderPreview();
});
const endDrag = () => {
  if (!drag) return; const d = drag; drag = null; GUIDE = { x: false, y: false };
  if (!d.moved && d.k === 'img' && !d.s.im.id) pickFiles(d.s.idx);
  if (d.moved) commit(); if (TAB === 'text' || TAB === 'photos') buildPanel(); renderPreview();
};
ovc.addEventListener('pointerup', endDrag); ovc.addEventListener('pointercancel', endDrag);
// drag & drop and paste
const wrapEl = $('#wrap');
['dragover', 'dragenter'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
window.addEventListener('drop', e => e.preventDefault());
wrapEl.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation(); const f = e.dataTransfer && e.dataTransfer.files; if (!f || !f.length) return;
  const [x, y] = ptr(e), s = hitSlot(x, y); addFiles(f, s ? s.idx : holder().sel);
});
window.addEventListener('paste', e => {
  const items = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.type.startsWith('image/')); if (!items.length) return;
  e.preventDefault(); addFiles(items.map(i => i.getAsFile()).filter(Boolean), holder().sel);
});
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (typing || SEL.k !== 'text') return;
  const L = curLayers().find(l => l.id === SEL.id); if (!L) return;
  const st = e.shiftKey ? 2 : .5;
  if (e.key === 'Delete' || e.key === 'Backspace') { delLayer(L.id); return; }
  if (L.locked) return;
  const mv = { ArrowLeft: ['x', -st], ArrowRight: ['x', st], ArrowUp: ['y', -st], ArrowDown: ['y', st] }[e.key];
  if (mv) { e.preventDefault(); L[mv[0]] += mv[1]; touch(); if (TAB === 'text') buildPanel(); }
});

/* ---------- project: save / load ---------- */
function payload(withImages) { const images = {}; if (withImages) usedImageIds().forEach(id => { images[id] = IMGS[id]; }); return { app: 'PinStudio Ultimate', version: 1, state: S, images }; }
function autosave() { try { localStorage.setItem('pinstudio.autosave', JSON.stringify(payload(true))); } catch (e) { try { localStorage.setItem('pinstudio.autosave', JSON.stringify(payload(false))); } catch (e2) { } } }
function saveProject() {
  try { localStorage.setItem('pinstudio.project', JSON.stringify(payload(true))); toast('Project saved in this browser', 'ok'); }
  catch (e) { try { localStorage.setItem('pinstudio.project', JSON.stringify(payload(false))); toast('Saved settings and text, but your photos were too big for browser storage. Use Export JSON to keep photos.', 'err'); } catch (e2) { toast('Could not save: browser storage is full. Use Export JSON instead.', 'err'); } }
}
function loadPayload(p) {
  if (!p || !p.state || !p.state.mode) throw new Error('This is not a PinStudio project file.');
  Object.assign(IMGS, p.images || {});
  const d = defaultState(), s = merge(d, p.state);
  ['photo', 'produce', 'badge'].forEach(m => { s[m].layers = (p.state[m] && p.state[m].layers ? p.state[m].layers : d[m].layers).map(mkText); });
  s.photo.images = s.photo.images.map(i => Object.assign(defImg(), i)); s.badge.imgs = s.badge.imgs.map(i => Object.assign(defImg(), i));
  S = s; SEL = { k: 'text', id: null }; if (TAB === 'photos' && S.mode === 'produce') TAB = 'design';
  ensureImages().then(renderPreview); rebuildAll(); commit(); ensureFonts().then(renderPreview);
}
function restoreProject() {
  try { const raw = localStorage.getItem('pinstudio.project') || localStorage.getItem('pinstudio.autosave'); if (!raw) return toast('Nothing saved yet.', 'err'); loadPayload(JSON.parse(raw)); toast('Project restored', 'ok'); }
  catch (e) { toast('Could not restore: ' + e.message, 'err'); }
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(payload(true))], { type: 'application/json' }), url = URL.createObjectURL(blob), a = el('a', { href: url, download: 'pinstudio-project.json' });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); toast('Project JSON downloaded', 'ok');
}
function copySettings() {
  const txt = JSON.stringify(payload(false), null, 1);
  const ok = () => toast('Settings copied (without photos)', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => toast('Copy was blocked by the browser.', 'err'));
  else { const t = el('textarea'); t.value = txt; document.body.append(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Copy not supported here.', 'err'); } t.remove(); }
}

/* ---------- init ---------- */
function init() {
  try { const sb = JSON.parse(localStorage.getItem('pinstudio.brand') || 'null'); if (sb && sb.brand) { S.brand = merge(defaultBrand(), sb.brand); if (sb.logoData && S.brand.logo) IMGS[S.brand.logo] = sb.logoData; else S.brand.logo = null; } } catch (e) { }
  MODES.forEach(([k, n]) => $('#modes').append(el('button', { 'data-m': k, onclick: () => setMode(k) }, n)));
  const q = $('#quick'); q.append(el('option', { value: '' }, 'Quick-start templates…')); CONTENT.forEach((p, i) => q.append(el('option', { value: i }, p.n)));
  q.onchange = () => { if (q.value !== '') applyContent(CONTENT[+q.value]); q.value = ''; };
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bSave').onclick = saveProject; $('#bExport').onclick = doExport;
  $('#bReset').onclick = () => { if (!confirm('Reset the current design to its defaults? (You can undo this.)')) return; const m = S.mode; S[m] = m === 'photo' ? defaultPhoto() : m === 'produce' ? defaultProduce() : defaultBadge(); SEL = { k: 'text', id: null }; rebuildAll(); commit(); };
  $('#fileIn').onchange = e => addFiles(e.target.files, pickTarget);
  document.body.append(el('input', { type: 'file', id: 'jsonIn', accept: '.json,application/json', hidden: true, onchange: e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { loadPayload(JSON.parse(fr.result)); toast('Project imported', 'ok'); } catch (err) { toast('Import failed: ' + err.message, 'err'); } }; fr.readAsText(f); e.target.value = ''; } }));
  new ResizeObserver(renderPreview).observe($('#stage'));
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', renderPreview);
  rebuildAll(); commit(); ensureFonts().then(renderPreview);
}
window.addEventListener('error', e => { try { toast('Unexpected error: ' + e.message, 'err'); } catch (x) { } });
init();

</script>
